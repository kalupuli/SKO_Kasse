<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kassen-Dashboard Stadtkapelle</title>
<style>
  :root{
    --bg:#ffffff;
    --ink:#252525;
    --ink-2:#666666;
    --ink-3:#8b8b8b;
    --line:#e3e3e3;
    --line-2:#f0f0f0;
    --soft:#f7f7f8;
    --blau:#26339f;        /* Vereinsblau */
    --rot:#c91515;         /* Vereinsrot  */
    --s1:#2f42c4;          /* Datenblau   */
    --s2:#c91515;
    --s3:#0f8a5f;
    --s4:#e08a00;
    --s1-hell:#aab2e6;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}

  .topbar{background:var(--rot);color:#fff;font-size:13px}
  .topbar div{max-width:1280px;margin:0 auto;padding:9px clamp(16px,3vw,32px)}

  header{border-bottom:1px solid var(--line)}
  .head{max-width:1280px;margin:0 auto;padding:26px clamp(16px,3vw,32px);
    display:flex;flex-wrap:wrap;gap:18px 26px;align-items:flex-end;justify-content:space-between}
  .mark{display:flex;align-items:center;gap:14px}
  .mark .sig{width:40px;height:40px;flex:none;background:var(--blau);border-radius:3px;
    display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px;letter-spacing:.02em}
  h1{font-size:clamp(22px,2.6vw,30px);font-weight:600;margin:0;line-height:1.2}
  .org{margin:2px 0 0;font-size:14px;color:var(--ink-2)}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tabs button{font-family:inherit;font-size:15px;font-weight:500;color:var(--ink-2);
    background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px 17px;cursor:pointer;
    transition:.15s}
  .tabs button:hover{border-color:var(--blau);color:var(--blau)}
  .tabs button[aria-selected="true"]{background:var(--blau);border-color:var(--blau);color:#fff}
  .tabs .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
  .tabs .toggle[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  button:focus-visible{outline:2px solid var(--blau);outline-offset:2px}

  main{max-width:1280px;margin:0 auto;padding:28px clamp(16px,3vw,32px) 60px}

  .kpis{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));overflow:hidden;margin-bottom:28px}
  .kpi{background:#fff;padding:18px 20px}
  .kpi .k{font-size:13px;color:var(--ink-2);margin:0 0 6px}
  .kpi .v{font-size:clamp(22px,2.3vw,28px);font-weight:600;margin:0;
    font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.15}
  .kpi .d{font-size:13px;margin:6px 0 0;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .b1{color:var(--s1)} .b2{color:var(--s2)} .b3{color:var(--s3)} .b4{color:var(--blau)}
  .up{color:var(--s3)} .down{color:var(--s2)}

  .grid{display:grid;gap:20px;grid-template-columns:repeat(12,1fr);align-items:start}
  .c12{grid-column:span 12} .c8{grid-column:span 8} .c6{grid-column:span 6} .c4{grid-column:span 4}
  @media (max-width:1040px){.c8,.c6{grid-column:span 12}.c4{grid-column:span 6}}
  @media (max-width:660px){.c4{grid-column:span 12}}

  .card{border:1px solid var(--line);border-radius:4px;padding:20px 22px;min-width:0;background:#fff}
  .card h2{font-size:16px;font-weight:600;margin:0}
  .card .sum{font-size:14px;color:var(--ink-2);margin:3px 0 18px;font-variant-numeric:tabular-nums}
  .chart{width:100%;overflow-x:auto}
  svg{display:block;width:100%;height:auto;overflow:visible}

  .legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:14px 0 0;padding:0;list-style:none;
    font-size:13px;color:var(--ink-2)}
  .legend li{display:flex;align-items:center;gap:7px}
  .sw{width:11px;height:11px;border-radius:2px;flex:none}

  table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line-2);text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left;white-space:normal}
  thead th{font-size:13px;color:var(--ink-2);font-weight:500;border-bottom:1px solid var(--line)}
  tbody th{font-weight:400}
  tr.total th,tr.total td{border-top:1px solid var(--line);border-bottom:0;font-weight:600}
  .scroll{overflow-x:auto}
  .aux{display:none;margin-top:4px}
  body.zahlen .aux{display:block}
  body.zahlen .card .chart,body.zahlen .card .legend{display:none}

  #tip{position:fixed;z-index:60;pointer-events:none;opacity:0;transform:translate(-50%,-140%);
    background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px 12px;font-size:13px;
    white-space:nowrap;transition:opacity .12s;box-shadow:0 6px 20px rgba(0,0,0,.12)}
  #tip b{display:block;color:var(--ink-2);font-size:12px;font-weight:400}
  #tip span{font-weight:600;font-variant-numeric:tabular-nums}

  .bar{transition:transform .5s ease-out}
  .hit{cursor:pointer}
  footer{border-top:1px solid var(--line);margin-top:36px;padding-top:18px;
    font-size:13px;color:var(--ink-2)}
  @media (prefers-reduced-motion:reduce){.bar{transition:none}}
  /* ---- Passwortschranke ---- */
  #gate{position:fixed;inset:0;z-index:100;background:#fff;display:grid;place-items:center;
    padding:24px}
  #gate form{width:100%;max-width:380px;border:1px solid var(--line);border-radius:4px;
    padding:32px 30px;text-align:left}
  #gate .sig{width:44px;height:44px;background:var(--blau);border-radius:3px;display:grid;
    place-items:center;color:#fff;font-weight:600;font-size:16px;margin-bottom:18px}
  #gate h2{font-size:22px;font-weight:600;margin:0}
  #gate .org{font-size:14px;color:var(--ink-2);margin:2px 0 24px}
  #gate label{display:block;font-size:14px;font-weight:500;margin-bottom:7px}
  #gate input{width:100%;font-family:inherit;font-size:16px;padding:11px 13px;
    border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
  #gate input:focus{outline:2px solid var(--blau);outline-offset:-1px;border-color:var(--blau)}
  #gate button{width:100%;margin-top:14px;font-family:inherit;font-size:16px;font-weight:500;
    padding:11px 16px;border:1px solid var(--blau);border-radius:4px;background:var(--blau);
    color:#fff;cursor:pointer}
  #gate button:hover{background:#1d2880;border-color:#1d2880}
  #gate button[disabled]{opacity:.6;cursor:default}
  #gate .msg{font-size:14px;margin:14px 0 0;min-height:1.4em}
  #gate .msg.err{color:var(--rot)}
  #gate .hint{font-size:13px;color:var(--ink-2);margin:22px 0 0;padding-top:16px;
    border-top:1px solid var(--line-2)}

</style>
</head>
<body>
<div id="gate">
  <form id="gateForm" autocomplete="on">
    <div class="sig" aria-hidden="true">SK</div>
    <h2>Kassen-Dashboard</h2>
    <p class="org">Stadtkapelle Offenburg e.V.</p>
    <label for="pw">Passwort</label>
    <input id="pw" type="password" autocomplete="current-password" spellcheck="false" required>
    <button type="submit" id="gateBtn">Öffnen</button>
    <p class="msg" id="gateMsg" role="alert"></p>
    <p class="hint">Die Zahlen sind in dieser Datei verschlüsselt gespeichert und werden erst
      nach Eingabe des Passworts entschlüsselt.</p>
  </form>
</div>

<div id="app" hidden>
<div class="topbar"><div>Stadtkapelle Offenburg e.V. · Kassenbericht</div></div>

<header>
  <div class="head">
    <div class="mark">
      <div class="sig" aria-hidden="true">SK</div>
      <div>
        <h1>Kassen-Dashboard</h1>
        <p class="org">Stadtkapelle Offenburg e.V.</p>
      </div>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Geschäftsjahr"></div>
  </div>
</header>

<main>
  <div id="view"></div>
  <footer id="foot"></footer>
</main>

<div id="tip" role="status"></div>
</div><!-- /#app -->

<script>
function boot(JAHRE){
"use strict";

/* Die Jahresdaten liegen verschlüsselt in DATEN (siehe unten). */

var C={s1:"#2f42c4",s2:"#c91515",s3:"#0f8a5f",s4:"#e08a00",s1h:"#aab2e6",
       ink:"#252525",ink2:"#666666",ink3:"#8b8b8b",grid:"#ececec"};
var RM=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var FONT='system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';

function fmt(n){return n.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";}
function short(n){return Math.round(n).toLocaleString("de-DE")+" €";}
function signed(n){return (n<0?"−":"+")+fmt(Math.abs(n));}
function pct(n){return n.toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1})+" %";}
function sum(rows){var s=0;rows.forEach(function(r){s+=r[1];});return Math.round(s*100)/100;}

var tip=document.getElementById("tip");
function bind(node,label,value){
  node.classList.add("hit");
  node.addEventListener("mousemove",function(e){
    tip.innerHTML="<b>"+label+"</b><span>"+value+"</span>";
    tip.style.left=e.clientX+"px";tip.style.top=e.clientY+"px";tip.style.opacity=1;});
  node.addEventListener("mouseleave",function(){tip.style.opacity=0;});
  node.setAttribute("tabindex","0");node.setAttribute("role","img");
  node.setAttribute("aria-label",label+": "+value);
}

var NS="http://www.w3.org/2000/svg";
function E(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
function T(x,y,s,o){o=o||{};
  var t=E("text",{x:x,y:y,fill:o.fill||C.ink2,"font-size":o.size||12.5,"font-family":FONT,
    "text-anchor":o.anchor||"start","font-weight":o.weight||400});
  t.textContent=s;return t;}
function anim(rect,axis,origin){
  rect.setAttribute("class","bar");
  rect.style.transformOrigin=axis==="x"?origin+"px 0px":"0px "+origin+"px";
  rect.style.transform=axis==="x"?"scaleX(0)":"scaleY(0)";
  requestAnimationFrame(function(){requestAnimationFrame(function(){rect.style.transform="none";});});
}

/* Balken waagerecht: rows = [Label, Wert] */
function barsH(host,rows,color,opt){
  opt=opt||{};
  var W=opt.w||700,lw=opt.labelW||212,vw=opt.valW||88,rh=opt.rowH||24,gap=10;
  var H=rows.length*(rh+gap);
  var max=Math.max.apply(null,rows.map(function(r){return r[1];}))||1;
  var pw=W-lw-vw;
  var svg=E("svg",{viewBox:"0 0 "+W+" "+H});
  rows.forEach(function(r,i){
    var y=i*(rh+gap);
    svg.appendChild(T(lw-12,y+rh/2+4.5,r[0],{anchor:"end",size:13,fill:C.ink2}));
    var w=Math.max(2,r[1]/max*pw);
    var g=E("g",{});
    var rect=E("rect",{x:lw,y:y,width:w,height:rh,fill:typeof color==="function"?color(i):color,rx:2});
    anim(rect,"x",lw);g.appendChild(rect);svg.appendChild(g);
    svg.appendChild(T(lw+w+10,y+rh/2+4.5,short(r[1]),{size:13,fill:C.ink,weight:600}));
    bind(g,r[0],fmt(r[1]));
  });
  host.appendChild(svg);
}

/* Balken senkrecht: rows = [Label, Wert, Farbe] */
function barsV(host,rows,opt){
  opt=opt||{};
  var W=opt.w||560,H=opt.h||240,pb=36,pt=30,px=24;
  var max=Math.max.apply(null,rows.map(function(r){return r[1];}))*1.22||1;
  var ph=H-pb-pt,pw=W-px*2,slot=pw/rows.length,bw=Math.min(opt.bw||72,slot*.5);
  var svg=E("svg",{viewBox:"0 0 "+W+" "+H});
  svg.appendChild(E("line",{x1:px,x2:W-px,y1:pt+ph,y2:pt+ph,stroke:C.grid,"stroke-width":1}));
  rows.forEach(function(r,i){
    var cx=px+slot*i+slot/2,h=Math.max(2,r[1]/max*ph),y=pt+ph-h;
    var g=E("g",{});
    var rect=E("rect",{x:cx-bw/2,y:y,width:bw,height:h,fill:r[2]||C.s1,rx:2});
    anim(rect,"y",pt+ph);g.appendChild(rect);svg.appendChild(g);
    svg.appendChild(T(cx,y-9,short(r[1]),{anchor:"middle",size:13,fill:C.ink,weight:600}));
    svg.appendChild(T(cx,pt+ph+21,r[0],{anchor:"middle",size:13,fill:C.ink2}));
    bind(g,r[0],fmt(r[1]));
  });
  host.appendChild(svg);
}

/* Zwei Reihen senkrecht: rows = [Label, a, b] */
function barsVGrouped(host,rows,names,colors,opt){
  opt=opt||{};
  var W=opt.w||620,H=opt.h||280,pb=36,pt=30,px=28;
  var max=0;rows.forEach(function(r){max=Math.max(max,r[1],r[2]);});max*=1.22;
  var ph=H-pb-pt,pw=W-px*2,slot=pw/rows.length,bw=Math.min(54,slot*.3);
  var svg=E("svg",{viewBox:"0 0 "+W+" "+H});
  svg.appendChild(E("line",{x1:px,x2:W-px,y1:pt+ph,y2:pt+ph,stroke:C.grid,"stroke-width":1}));
  rows.forEach(function(r,i){
    var cx=px+slot*i+slot/2;
    [1,2].forEach(function(k){
      var v=r[k],h=Math.max(2,v/max*ph),y=pt+ph-h,x=cx-bw-3+(k-1)*(bw+6);
      var g=E("g",{});
      var rect=E("rect",{x:x,y:y,width:bw,height:h,fill:colors[k-1],rx:2});
      anim(rect,"y",pt+ph);g.appendChild(rect);svg.appendChild(g);
      svg.appendChild(T(x+bw/2,y-8,short(v),{anchor:"middle",size:11.5,fill:C.ink2}));
      bind(g,r[0]+" · "+names[k-1],fmt(v));
    });
    svg.appendChild(T(cx,pt+ph+21,r[0],{anchor:"middle",size:14,fill:C.ink,weight:600}));
  });
  host.appendChild(svg);
}

/* Zwei Reihen waagerecht: rows = [Label, a, b] */
function barsHGrouped(host,rows,colors,names){
  var W=700,lw=158,vw=84,rh=12,gi=4,go=15;
  var H=rows.length*(rh*2+gi+go);
  var max=0;rows.forEach(function(r){max=Math.max(max,r[1],r[2]);});max=max||1;
  var pw=W-lw-vw;
  var svg=E("svg",{viewBox:"0 0 "+W+" "+H});
  rows.forEach(function(r,i){
    var y=i*(rh*2+gi+go);
    svg.appendChild(T(lw-12,y+rh+2,r[0],{anchor:"end",size:13,fill:C.ink2}));
    [1,2].forEach(function(k){
      var yy=y+(k-1)*(rh+gi),w=Math.max(2,r[k]/max*pw);
      var g=E("g",{});
      var rect=E("rect",{x:lw,y:yy,width:w,height:rh,fill:colors[k-1],rx:2});
      anim(rect,"x",lw);g.appendChild(rect);svg.appendChild(g);
      svg.appendChild(T(lw+w+8,yy+rh-1.5,short(r[k]),{size:11.5,fill:C.ink2}));
      bind(g,r[0]+" · "+names[k-1],fmt(r[k]));
    });
  });
  host.appendChild(svg);
}

/* Ergebnis um die Nulllinie: rows = [Label, Wert] */
function diverging(host,rows,opt){
  opt=opt||{};
  var W=opt.w||340,H=opt.h||280,pt=30,pb=30,px=24;
  var vals=rows.map(function(r){return r[1];});
  var hi=Math.max.apply(null,vals.concat([0])),lo=Math.min.apply(null,vals.concat([0]));
  var span=(hi-lo)*1.3||1;
  var ph=H-pt-pb,pw=W-px*2,slot=pw/rows.length,bw=Math.min(60,slot*.45);
  var zero=pt+ph*(hi+(span-(hi-lo))/2)/span;
  var svg=E("svg",{viewBox:"0 0 "+W+" "+H});
  svg.appendChild(E("line",{x1:px,x2:W-px,y1:zero,y2:zero,stroke:"#d5d5d5","stroke-width":1}));
  rows.forEach(function(r,i){
    var cx=px+slot*i+slot/2,h=Math.abs(r[1])/span*ph,y=r[1]>=0?zero-h:zero;
    var col=r[1]>=0?C.s3:C.s2;
    var g=E("g",{});
    var rect=E("rect",{x:cx-bw/2,y:y,width:bw,height:Math.max(2,h),fill:col,rx:2});
    anim(rect,"y",zero);g.appendChild(rect);svg.appendChild(g);
    svg.appendChild(T(cx,r[1]>=0?y-9:y+h+17,(r[1]<0?"−":"+")+short(Math.abs(r[1])),
      {anchor:"middle",size:13,fill:col,weight:600}));
    svg.appendChild(T(cx,r[1]>=0?zero+17:zero-8,r[0],{anchor:"middle",size:14,fill:C.ink,weight:600}));
    bind(g,r[0]+" · Ergebnis",signed(r[1]));
  });
  host.appendChild(svg);
}

/* Linie mit Punkten: rows = [Label, Wert] */
function line(host,rows,color,opt){
  opt=opt||{};
  var W=opt.w||620,H=opt.h||240,pt=34,pb=34,px=48;
  var hi=Math.max.apply(null,rows.map(function(r){return r[1];}))*1.16||1;
  var ph=H-pt-pb,pw=W-px*2,step=rows.length>1?pw/(rows.length-1):0;
  var svg=E("svg",{viewBox:"0 0 "+W+" "+H});
  svg.appendChild(E("line",{x1:px,x2:W-px,y1:pt+ph,y2:pt+ph,stroke:C.grid,"stroke-width":1}));
  var pts=rows.map(function(r,i){return [px+step*i, pt+ph-(r[1]/hi)*ph];});
  svg.appendChild(E("path",{d:"M "+pts.map(function(p){return p[0]+" "+p[1];}).join(" L "),
    fill:"none",stroke:color,"stroke-width":2,"stroke-linejoin":"round"}));
  rows.forEach(function(r,i){
    var p=pts[i];
    var c=E("circle",{cx:p[0],cy:p[1],r:5,fill:color,stroke:"#fff","stroke-width":2});
    svg.appendChild(c);
    svg.appendChild(T(p[0],p[1]-14,short(r[1]),{anchor:"middle",size:13,fill:C.ink,weight:600}));
    svg.appendChild(T(p[0],pt+ph+21,r[0],{anchor:"middle",size:13,fill:C.ink2}));
    bind(c,r[0],fmt(r[1]));
  });
  host.appendChild(svg);
}

/* ---------- DOM ---------- */
function h(tag,cls,html){var n=document.createElement(tag);if(cls)n.className=cls;
  if(html!==undefined)n.innerHTML=html;return n;}
function card(col,title,sub){
  var c=h("div","card "+col);
  c.appendChild(h("h2",null,title));
  c.appendChild(h("p","sum",sub||""));
  var ch=h("div","chart");c.appendChild(ch);c.chart=ch;return c;
}
function tableEl(head,rows,totalRow){
  var wrap=h("div","scroll"),t=document.createElement("table");
  var thead=document.createElement("thead"),tr=document.createElement("tr");
  head.forEach(function(x){var th=document.createElement("th");th.textContent=x;tr.appendChild(th);});
  thead.appendChild(tr);t.appendChild(thead);
  var tb=document.createElement("tbody");
  function row(cells,cls){
    var r=document.createElement("tr");if(cls)r.className=cls;
    cells.forEach(function(c,i){var el=document.createElement(i===0?"th":"td");
      if(i===0)el.setAttribute("scope","row");el.textContent=c;r.appendChild(el);});
    tb.appendChild(r);
  }
  rows.forEach(function(r){row(r);});
  if(totalRow)row(totalRow,"total");
  t.appendChild(tb);wrap.appendChild(t);return wrap;
}
function withTable(c,head,rows,total){
  var box=h("div","aux");
  box.appendChild(tableEl(head,rows,total));
  c.appendChild(box);
  return c;
}
function kpi(label,value,cls,delta){
  var k=h("div","kpi");
  k.appendChild(h("p","k",label));
  k.appendChild(h("p","v "+(cls||""),value));
  if(delta)k.appendChild(h("p","d "+(delta.cls||""),delta.text));
  return k;
}

/* ---------- Jahresansicht ---------- */
function renderYear(y){
  var view=document.getElementById("view");view.innerHTML="";
  var prev=null;
  JAHRE.forEach(function(j,i){if(j.jahr===y.jahr&&i>0)prev=JAHRE[i-1];});
  var pj=prev?prev.jahr:"";

  function delta(cur,pre,invert){
    var d=cur-pre,good=invert?d<0:d>0;
    var txt=(d<0?"−":"+")+short(Math.abs(d));
    if(pre>0)txt+=" ("+(d<0?"−":"+")+pct(Math.abs(d/pre*100))+")";
    return {text:txt+" ggü. "+pj,cls:good?"up":"down"};
  }

  var k=h("div","kpis");
  k.appendChild(kpi("Einnahmen",fmt(y.einnahmen),"b1",prev?delta(y.einnahmen,prev.einnahmen):null));
  k.appendChild(kpi("Ausgaben",fmt(y.ausgaben),"b2",prev?delta(y.ausgaben,prev.ausgaben,true):null));
  k.appendChild(kpi("Ergebnis",signed(y.ergebnis),y.ergebnis>=0?"b3":"b2",
    prev?delta(y.ergebnis,prev.ergebnis):null));
  var dv=y.vermoegen.ende-y.vermoegen.start;
  k.appendChild(kpi("Vermögen 31.12.",fmt(y.vermoegen.ende),"b4",
    {text:(dv<0?"−":"+")+short(Math.abs(dv))+" im Jahr",cls:dv>=0?"up":"down"}));
  view.appendChild(k);

    boot(jahre);
  })
  .catch(function(){
    btn.disabled=false;
    sag("Passwort falsch.",true);
    pw.value=""; pw.focus();
  });
}
pw.focus();
})();
</script>
