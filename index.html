<title>Kassen-Dashboard Stadtkapelle</title>
<style>
  :root{
    --bg:#ffffff;
    --ink:#252525;
    --ink-2:#666666;
    --ink-3:#8b8b8b;
    --line:#e3e3e3;
    --line-2:#f0f0f0;
    --soft:#f7f7f8;
    --blau:#26339f;        /* Vereinsblau */
    --rot:#c91515;         /* Vereinsrot  */
    --s1:#2f42c4;          /* Datenblau   */
    --s2:#c91515;
    --s3:#0f8a5f;
    --s4:#e08a00;
    --s1-hell:#aab2e6;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}

  .topbar{background:var(--rot);color:#fff;font-size:13px}
  .topbar div{max-width:1280px;margin:0 auto;padding:9px clamp(16px,3vw,32px)}

  header{border-bottom:1px solid var(--line)}
  .head{max-width:1280px;margin:0 auto;padding:26px clamp(16px,3vw,32px);
    display:flex;flex-wrap:wrap;gap:18px 26px;align-items:flex-end;justify-content:space-between}
  .mark{display:flex;align-items:center;gap:14px}
  .mark .sig{width:40px;height:40px;flex:none;background:var(--blau);border-radius:3px;
    display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px;letter-spacing:.02em}
  h1{font-size:clamp(22px,2.6vw,30px);font-weight:600;margin:0;line-height:1.2}
  .org{margin:2px 0 0;font-size:14px;color:var(--ink-2)}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tabs button{font-family:inherit;font-size:15px;font-weight:500;color:var(--ink-2);
    background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px 17px;cursor:pointer;
    transition:.15s}
  .tabs button:hover{border-color:var(--blau);color:var(--blau)}
  .tabs button[aria-selected="true"]{background:var(--blau);border-color:var(--blau);color:#fff}
  .tabs .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
  .tabs .toggle[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  button:focus-visible{outline:2px solid var(--blau);outline-offset:2px}

  main{max-width:1280px;margin:0 auto;padding:28px clamp(16px,3vw,32px) 60px}

  .kpis{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));overflow:hidden;margin-bottom:28px}
  .kpi{background:#fff;padding:18px 20px}
  .kpi .k{font-size:13px;color:var(--ink-2);margin:0 0 6px}
  .kpi .v{font-size:clamp(22px,2.3vw,28px);font-weight:600;margin:0;
    font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.15}
  .kpi .d{font-size:13px;margin:6px 0 0;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .b1{color:var(--s1)} .b2{color:var(--s2)} .b3{color:var(--s3)} .b4{color:var(--blau)}
  .up{color:var(--s3)} .down{color:var(--s2)}

  .grid{display:grid;gap:20px;grid-template-columns:repeat(12,1fr);align-items:start}
  .c12{grid-column:span 12} .c8{grid-column:span 8} .c6{grid-column:span 6} .c4{grid-column:span 4}
  @media (max-width:1040px){.c8,.c6{grid-column:span 12}.c4{grid-column:span 6}}
  @media (max-width:660px){.c4{grid-column:span 12}}

  .card{border:1px solid var(--line);border-radius:4px;padding:20px 22px;min-width:0;background:#fff}
  .card h2{font-size:16px;font-weight:600;margin:0}
  .card .sum{font-size:14px;color:var(--ink-2);margin:3px 0 18px;font-variant-numeric:tabular-nums}
  .chart{width:100%;overflow-x:auto}
  svg{display:block;width:100%;height:auto;overflow:visible}

  .legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:14px 0 0;padding:0;list-style:none;
    font-size:13px;color:var(--ink-2)}
  .legend li{display:flex;align-items:center;gap:7px}
  .sw{width:11px;height:11px;border-radius:2px;flex:none}

  table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line-2);text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left;white-space:normal}
  thead th{font-size:13px;color:var(--ink-2);font-weight:500;border-bottom:1px solid var(--line)}
  tbody th{font-weight:400}
  tr.total th,tr.total td{border-top:1px solid var(--line);border-bottom:0;font-weight:600}
  .scroll{overflow-x:auto}
  .aux{display:none;margin-top:4px}
  body.zahlen .aux{display:block}
  body.zahlen .card .chart,body.zahlen .card .legend{display:none}

  #tip{position:fixed;z-index:60;pointer-events:none;opacity:0;transform:translate(-50%,-140%);
    background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px 12px;font-size:13px;
    white-space:nowrap;transition:opacity .12s;box-shadow:0 6px 20px rgba(0,0,0,.12)}
  #tip b{display:block;color:var(--ink-2);font-size:12px;font-weight:400}
  #tip span{font-weight:600;font-variant-numeric:tabular-nums}

  .bar{transition:transform .5s ease-out}
  .hit{cursor:pointer}
  footer{border-top:1px solid var(--line);margin-top:36px;padding-top:18px;
    font-size:13px;color:var(--ink-2)}
  @media (prefers-reduced-motion:reduce){.bar{transition:none}}
</style>

/* Balken waagerecht: rows = [Label, Wert] */
function barsH(host,rows,color,opt){

  c.appendChild(h("h2",null,title));
  c.appendChild(h("p","sum",sub||""));
  var ch=h("div","chart");c.appendChild(ch);c.chart=ch;return c;
}
function tableEl(head,rows,totalRow){
  var wrap=h("div","scroll"),t=document.createElement("table");
  var thead=document.createElement("thead"),tr=document.createElement("tr");
  head.forEach(function(x){var th=document.createElement("th");th.textContent=x;tr.appendChild(th);});
  thead.appendChild(tr);t.appendChild(thead);
  var tb=document.createElement("tbody");
  function row(cells,cls){
    var r=document.createElement("tr");if(cls)r.className=cls;
    cells.forEach(function(c,i){var el=document.createElement(i===0?"th":"td");
      if(i===0)el.setAttribute("scope","row");el.textContent=c;r.appendChild(el);});
    tb.appendChild(r);
  }
  rows.forEach(function(r){row(r);});
  if(totalRow)row(totalRow,"total");
  t.appendChild(tb);wrap.appendChild(t);return wrap;
}
function withTable(c,head,rows,total){
  var box=h("div","aux");
  box.appendChild(tableEl(head,rows,total));
  c.appendChild(box);
  return c;
}
function kpi(label,value,cls,delta){
  var k=h("div","kpi");
  k.appendChild(h("p","k",label));
  k.appendChild(h("p","v "+(cls||""),value));
  if(delta)k.appendChild(h("p","d "+(delta.cls||""),delta.text));
  return k;
}

/* ---------- Jahresansicht ---------- */
function renderYear(y){
  var view=document.getElementById("view");view.innerHTML="";
  var prev=null;
  JAHRE.forEach(function(j,i){if(j.jahr===y.jahr&&i>0)prev=JAHRE[i-1];});
  var pj=prev?prev.jahr:"";

  function delta(cur,pre,invert){
    var d=cur-pre,good=invert?d<0:d>0;
    var txt=(d<0?"−":"+")+short(Math.abs(d));
    if(pre>0)txt+=" ("+(d<0?"−":"+")+pct(Math.abs(d/pre*100))+")";
    return {text:txt+" ggü. "+pj,cls:good?"up":"down"};
  }

  var k=h("div","kpis");
  k.appendChild(kpi("Einnahmen",fmt(y.einnahmen),"b1",prev?delta(y.einnahmen,prev.einnahmen):null));
  k.appendChild(kpi("Ausgaben",fmt(y.ausgaben),"b2",prev?delta(y.ausgaben,prev.ausgaben,true):null));
  k.appendChild(kpi("Ergebnis",signed(y.ergebnis),y.ergebnis>=0?"b3":"b2",
    prev?delta(y.ergebnis,prev.ergebnis):null));
  var dv=y.vermoegen.ende-y.vermoegen.start;
  k.appendChild(kpi("Vermögen 31.12.",fmt(y.vermoegen.ende),"b4",
    {text:(dv<0?"−":"+")+short(Math.abs(dv))+" im Jahr",cls:dv>=0?"up":"down"}));
  view.appendChild(k);

  var g=h("div","grid");
  var mieteS=sum(y.miete),instrS=sum(y.instr),spendenS=sum(y.spenden);

  var a=card("c6","Einnahmen nach Bereichen","Summe "+fmt(y.einnahmen));
  barsH(a.chart,y.bereiche,function(i){return [C.s1,C.s2,C.s3,C.s4][i%4];},{labelW:196,rowH:28});
  withTable(a,["Bereich","Betrag"],
    y.bereiche.map(function(r){return [r[0],fmt(r[1])];}),["Summe",fmt(y.einnahmen)]);
  g.appendChild(a);

  var b=card("c6","Ausgaben nach Kostenblöcken","Summe "+fmt(y.ausgaben));
  barsH(b.chart,y.bloecke,C.s2,{labelW:212,rowH:22});
  withTable(b,["Kostenblock","Betrag"],
    y.bloecke.map(function(r){return [r[0],fmt(r[1])];}),["Summe",fmt(y.ausgaben)]);
  g.appendChild(b);

  var narrow={w:470,labelW:206,valW:86,rowH:24};
  function kurz(rows){return rows.map(function(r){
    return [r[0].replace("Miete Ausbildungsinstrumente","Ausbildungsinstr.")
                .replace("Versicherung Instrumente","Versicherung")
                .replace("Reparatur Instrumente","Reparatur")
                .replace("Instrumente / Anschaffung","Anschaffung")
                .replace("Spenden (210 + 212)","Spenden (210+212)"), r[1]];});}

  var c=card("c4","Altpapier und Instrumentenmiete","Summe "+fmt(y.altpapier+mieteS));
  barsH(c.chart,kurz([["Altpapier (580)",y.altpapier]].concat(y.miete)),
    function(i){return i===0?C.s3:C.s1;},narrow);
  withTable(c,["Position","Betrag"],
    [["Altpapier (580)",fmt(y.altpapier)]].concat(y.miete.map(function(r){return [r[0],fmt(r[1])];})),
    ["Summe",fmt(y.altpapier+mieteS)]);
  g.appendChild(c);

  var d=card("c4","Ausgaben Instrumente","Summe "+fmt(instrS));
  barsH(d.chart,kurz(y.instr),C.s2,narrow);
  withTable(d,["Konto","Betrag"],y.instr.map(function(r){return [r[0],fmt(r[1])];}),
    ["Summe",fmt(instrS)]);
  g.appendChild(d);

  var e=card("c4","Spenden und Förderung","Summe "+fmt(spendenS));
  barsH(e.chart,kurz(y.spenden),C.s4,narrow);
  withTable(e,["Konto","Betrag"],y.spenden.map(function(r){return [r[0],fmt(r[1])];}),
    ["Summe",fmt(spendenS)]);
  g.appendChild(e);

  var f=card("c8","Finanzkonten",fmt(y.vermoegen.start)+" am 01.01. → "+fmt(y.vermoegen.ende)+" am 31.12.");
  barsHGrouped(f.chart,y.vermoegen.konten,[C.s1h,C.s1],["01.01."+y.jahr,"31.12."+y.jahr]);
  var lg=h("ul","legend");
  lg.innerHTML='<li><span class="sw" style="background:'+C.s1h+'"></span>01.01.'+y.jahr+'</li>'+
               '<li><span class="sw" style="background:'+C.s1+'"></span>31.12.'+y.jahr+'</li>';
  f.appendChild(lg);
  withTable(f,["Finanzkonto","01.01."+y.jahr,"31.12."+y.jahr,"Veränderung"],
    y.vermoegen.konten.map(function(r){return [r[0],fmt(r[1]),fmt(r[2]),signed(r[2]-r[1])];}),
    ["Summe",fmt(y.vermoegen.start),fmt(y.vermoegen.ende),signed(dv)]);
  g.appendChild(f);

  var t=card("c4","Kennzahlen "+y.jahr,"");
  t.removeChild(t.chart);
  t.appendChild(tableEl(["Position","Betrag"],[
    ["Einnahmen gesamt",fmt(y.einnahmen)],
    ["Ausgaben gesamt",fmt(y.ausgaben)],
    ["Ergebnis",signed(y.ergebnis)],
    ["Altpapier (580)",fmt(y.altpapier)],
    ["Instrumentenmiete (254 + 266)",fmt(mieteS)],
    ["Ausgaben Instrumente (620/621/835)",fmt(instrS)],
    ["Spenden und Förderung",fmt(spendenS)],
    ["Vermögen 01.01.",fmt(y.vermoegen.start)],
    ["Vermögen 31.12.",fmt(y.vermoegen.ende)]
  ]));
  g.appendChild(t);

  view.appendChild(g);
}

/* ---------- Verlauf ---------- */
function renderTrend(){
  var view=document.getElementById("view");view.innerHTML="";
  var Y=JAHRE.map(function(j){return String(j.jahr);});
  var first=JAHRE[0],last=JAHRE[JAHRE.length-1];
  var kum=JAHRE.reduce(function(s,j){return s+j.ergebnis;},0);

  var k=h("div","kpis");
  k.appendChild(kpi("Zeitraum",Y[0]+" – "+Y[Y.length-1],"b4",{text:JAHRE.length+" Geschäftsjahre"}));
  k.appendChild(kpi("Einnahmen kumuliert",
    fmt(JAHRE.reduce(function(s,j){return s+j.einnahmen;},0)),"b1"));
  k.appendChild(kpi("Ausgaben kumuliert",
    fmt(JAHRE.reduce(function(s,j){return s+j.ausgaben;},0)),"b2"));
  k.appendChild(kpi("Ergebnis kumuliert",signed(kum),kum>=0?"b3":"b2",
    {text:"Vermögen "+short(first.vermoegen.start)+" → "+short(last.vermoegen.ende),
     cls:last.vermoegen.ende>=first.vermoegen.start?"up":"down"}));
  view.appendChild(k);

  var g=h("div","grid");

  var a=card("c8","Einnahmen und Ausgaben je Jahr","");
  barsVGrouped(a.chart,JAHRE.map(function(j){return [String(j.jahr),j.einnahmen,j.ausgaben];}),
    ["Einnahmen","Ausgaben"],[C.s1,C.s2],{h:290});
  var lg=h("ul","legend");
  lg.innerHTML='<li><span class="sw" style="background:'+C.s1+'"></span>Einnahmen</li>'+
               '<li><span class="sw" style="background:'+C.s2+'"></span>Ausgaben</li>';
  a.appendChild(lg);
  withTable(a,["Jahr","Einnahmen","Ausgaben"],
    JAHRE.map(function(j){return [String(j.jahr),fmt(j.einnahmen),fmt(j.ausgaben)];}));
  g.appendChild(a);

  var b=card("c4","Jahresergebnis","");
  diverging(b.chart,JAHRE.map(function(j){return [String(j.jahr),j.ergebnis];}),{h:290,w:330});
  withTable(b,["Jahr","Ergebnis"],
    JAHRE.map(function(j){return [String(j.jahr),signed(j.ergebnis)];}),["Summe",signed(kum)]);
  g.appendChild(b);

  var c=card("c6","Vermögen zum 31.12.","");
  line(c.chart,JAHRE.map(function(j){return [String(j.jahr),j.vermoegen.ende];}),C.s1,{h:240});
  withTable(c,["Jahr","Vermögen 31.12."],
    JAHRE.map(function(j){return [String(j.jahr),fmt(j.vermoegen.ende)];}));
  g.appendChild(c);

  var d=card("c6","Altpapier · Konto 580","");
  barsV(d.chart,JAHRE.map(function(j){return [String(j.jahr),j.altpapier,C.s3];}),{h:240,bw:70});
  withTable(d,["Jahr","Betrag"],JAHRE.map(function(j){return [String(j.jahr),fmt(j.altpapier)];}));
  g.appendChild(d);

  var e=card("c6","Einnahmen Instrumentenmiete · 254 + 266","");
  barsV(e.chart,JAHRE.map(function(j){return [String(j.jahr),sum(j.miete),C.s1];}),{h:240,bw:70});
  withTable(e,["Jahr","Betrag"],JAHRE.map(function(j){return [String(j.jahr),fmt(sum(j.miete))];}));
  g.appendChild(e);

  var f=card("c6","Ausgaben Instrumente · 620 + 621 + 835","");
  barsV(f.chart,JAHRE.map(function(j){return [String(j.jahr),sum(j.instr),C.s2];}),{h:240,bw:70});
  withTable(f,["Jahr","Betrag"],JAHRE.map(function(j){return [String(j.jahr),fmt(sum(j.instr))];}));
  g.appendChild(f);

  var s=card("c6","Spenden und Förderung","");
  barsV(s.chart,JAHRE.map(function(j){return [String(j.jahr),sum(j.spenden),C.s4];}),{h:240,bw:70});
  withTable(s,["Jahr","Betrag"],JAHRE.map(function(j){return [String(j.jahr),fmt(sum(j.spenden))];}));
  g.appendChild(s);

  var t=card("c6","Alle Kennzahlen im Verlauf","");
  t.removeChild(t.chart);
  function row(label,fn,sg){
    return [label].concat(JAHRE.map(function(j){return sg?signed(fn(j)):fmt(fn(j));}));
  }
  t.appendChild(tableEl(["Position"].concat(Y),[
    row("Einnahmen",function(j){return j.einnahmen;}),
    row("Ausgaben",function(j){return j.ausgaben;}),
    row("Ergebnis",function(j){return j.ergebnis;},true),
    row("Altpapier (580)",function(j){return j.altpapier;}),
    row("Instrumentenmiete (254 + 266)",function(j){return sum(j.miete);}),
    row("Ausgaben Instrumente",function(j){return sum(j.instr);}),
    row("Spenden und Förderung",function(j){return sum(j.spenden);}),
    row("Vermögen 01.01.",function(j){return j.vermoegen.start;}),
    row("Vermögen 31.12.",function(j){return j.vermoegen.ende;})
  ]));
  g.appendChild(t);

  view.appendChild(g);
}

/* ---------- Navigation ---------- */
var tabsEl=document.getElementById("tabs"),tabs=[];
JAHRE.forEach(function(j){
  var b=document.createElement("button");
  b.setAttribute("role","tab");b.textContent=j.jahr;b.dataset.year=j.jahr;
  tabsEl.appendChild(b);tabs.push(b);
});
var tb=document.createElement("button");
tb.setAttribute("role","tab");tb.textContent="Verlauf";tb.dataset.year="trend";
tabsEl.appendChild(tb);tabs.push(tb);
tabsEl.appendChild(h("span","sep"));
var auxBtn=document.createElement("button");
auxBtn.className="toggle";auxBtn.textContent="Tabellen";auxBtn.setAttribute("aria-pressed","false");
tabsEl.appendChild(auxBtn);

function select(key){
  tabs.forEach(function(b){b.setAttribute("aria-selected",b.dataset.year===String(key)?"true":"false");});
  if(key==="trend")renderTrend();
  else renderYear(JAHRE.filter(function(j){return j.jahr===Number(key);})[0]);
  document.getElementById("foot").innerHTML =
    "Quellen: Einnahmen-Überschussrechnung, Sachkonten-Saldenliste und Vermögensaufstellung "+
    JAHRE[0].jahr+"–"+JAHRE[JAHRE.length-1].jahr+", Gewinnermittlung nach §4 Abs. 3 EStG.<br>"+
    "Endbestand 2024 9.198,36 € / Anfangsbestand 2025 9.199,61 € — Differenz 1,25 € auf VB Giro.";
}
tabs.forEach(function(b){b.addEventListener("click",function(){select(b.dataset.year);});});
function toggleAux(){
  var on=document.body.classList.toggle("zahlen");
  auxBtn.setAttribute("aria-pressed",on?"true":"false");
  auxBtn.textContent=on?"Diagramme":"Tabellen";
  auxBtn.title=on?"Zurück zu den Diagrammen":"Zahlen statt Diagramme anzeigen";
}
auxBtn.addEventListener("click",toggleAux);
document.addEventListener("keydown",function(ev){
  if(ev.target.tagName==="BUTTON"&&(ev.key===" "||ev.key==="Enter"))return;
  var i=tabs.map(function(b){return b.getAttribute("aria-selected");}).indexOf("true");
  if(ev.key==="ArrowRight"){ev.preventDefault();select(tabs[(i+1)%tabs.length].dataset.year);}
  if(ev.key==="ArrowLeft"){ev.preventDefault();select(tabs[(i-1+tabs.length)%tabs.length].dataset.year);}
  if(ev.key==="t"||ev.key==="T")toggleAux();
});

select(JAHRE[JAHRE.length-1].jahr);
})();
</script>
